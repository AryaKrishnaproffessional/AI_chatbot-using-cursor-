<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Career Compass Chatbot</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div>
          <h1>Career Compass Chatbot</h1>
          <p>
            Internships, graduate programs, and jobs tailored to your study
            area.
          </p>
        </div>
        <div class="header-actions">
          <button id="theme-toggle" class="ghost-button" type="button">
            Dark mode
          </button>
          <button id="reset" class="ghost-button" type="button">
            Start over
          </button>
        </div>
      </header>

      <section id="chat" class="chat" aria-live="polite"></section>

      <section class="composer">
        <p class="input-hint">
          Type here first to refine results, or use the quick buttons in the
          chat.
        </p>
        <form id="input-form" class="input-bar">
          <label class="sr-only" for="message-input">Message</label>
          <input
            id="message-input"
            type="text"
            placeholder="Ask about roles, locations, or interview prep..."
            autocomplete="off"
            autofocus
          />
          <button type="submit">Send</button>
        </form>
      </section>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
